apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Argo CD catalog for the shared platform: the AppProjects "platform" (also used by every roboshop-ai app)
# and "logging", the monitoring stack (sources in this repo, observability/…) and metrics-server.
# scripts/argocd/*.py read this catalog together with roboshop-ai/argocd.
resources:
- project-platform.yaml
- project-logging.yaml
- metrics-server.yaml
- grafana.yaml
- prometheus.yaml
- loki.yaml
