apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: logging
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/mrjithendar/roboshop-ai.git
  - https://github.com/mrjithendar/tools.git
  - https://github.com/mrjithendar/moks.git
  destinations:
  - namespace: monitoring
    server: https://kubernetes.default.svc
  - namespace: observability
    server: https://kubernetes.default.svc
  - namespace: traefik
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  # Alloy reads pods and their logs in every namespace.
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: Deployment
  # Argo CD leaves unlisted kinds out of the app tree, so these two are what show the pods, logs and events.
  - group: apps
    kind: ReplicaSet
  - group: ''
    kind: Pod
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
