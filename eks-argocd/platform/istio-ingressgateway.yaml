autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  minAvailable: 1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      istio: ingressgateway
service:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  allocateLoadBalancerNodePorts: false # IP targets reach the pods directly
  # Becomes the NLB's frontend security group: home IP. An empty list opens the NLB to the Internet;
  # 0.0.0.0/0 is set here at eks-argocd/RUNBOOK.md step 10.
  loadBalancerSourceRanges:
  - 122.177.247.138/32
  # Only Service ports become listeners, so the 15021 status port stays private and is used solely by the health
  # check. Port 80 only redirects to HTTPS, through the Gateway in eks-argocd/roboshop-demo/ingress.
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 443
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-name: roboshop-demo-ingress
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-0ef26ae94b23e4e7f,subnet-04a13b0bc285ab87a # terraform output public_subnets
    # TCP passthrough: no aws-load-balancer-ssl-cert, so TLS terminates on the gateway pods.
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "15021"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz/ready
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "10"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-unhealthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: deregistration_delay.timeout_seconds=30,preserve_client_ip.enabled=false
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: Project=roboshop-ai,Environment=demo,ManagedBy=aws-load-balancer-controller
