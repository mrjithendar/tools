{{- if .Values.issuers.production }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuers.production.name | quote }}
spec:
  acme:
    email: {{ required "Set an ACME email" .Values.email | quote }}
    server: {{ .Values.issuers.production.server | quote }}
    privateKeySecretRef:
      name: {{ .Values.issuers.production.accountSecret | quote }}
    solvers:
      {{- if .Values.dns01 }}
      - selector:
          dnsZones:
            - {{ .Values.dns01.zone | quote }}
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.dns01.apiTokenSecret | quote }}
              key: {{ .Values.dns01.apiTokenKey | quote }}
      {{- else }}
      - http01:
          ingress:
            ingressClassName: {{ required "Set ingressClassName" .Values.ingressClassName | quote }}
      {{- end }}
{{- end }}
