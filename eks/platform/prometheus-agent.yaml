# Agent mode keeps only a short write-ahead buffer, so the data lives on mk4, which cannot reach these private nodes.
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
server:
  defaultFlagsOverride:
  - --agent
  - --config.file=/etc/config/prometheus.yml
  - --storage.agent.path=/data
  persistentVolume:
    enabled: false
  retention: ""
  global:
    scrape_interval: 30s
    external_labels:
      cluster: roboshop-demo
  remoteWrite:
  - url: https://jithendar.com/prometheus/api/v1/write
    basic_auth:
      username: eks
      password_file: /etc/secrets/remote-write/password
  extraSecretMounts:
  - name: remote-write-auth
    mountPath: /etc/secrets/remote-write
    secretName: prometheus-remote-write-auth
    readOnly: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
# null drops the chart's default jobs, which would push every pod and node metric to mk4.
scrapeConfigs: null
serverFiles:
  prometheus.yml:
    rule_files: []
    scrape_configs:
    - job_name: eks-node-exporter
      kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names:
          - prometheus-node-exporter
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_service_name
        regex: prometheus-node-exporter
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_node_name
        target_label: node
