# The NLB only forwards TCP, so this is where TLS ends. Port 80 only redirects, for browsers that reach the NLB directly.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - eks.jithendar.com
    - jithendar.com
    tls:
      mode: SIMPLE
      credentialName: jithendar-com-tls
      minProtocolVersion: TLSV1_2
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - eks.jithendar.com
    - jithendar.com
    tls:
      httpsRedirect: true
