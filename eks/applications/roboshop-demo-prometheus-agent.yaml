# Pushes node metrics to the Prometheus on mk4. Create the Secret first: observability/prometheus/README.md, "Metrics from EKS".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-prometheus-agent
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks-platform
  destination:
    name: roboshop-demo
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.40.3
    helm:
      releaseName: prometheus-agent
      valueFiles:
      - $values/eks/platform/prometheus-agent.yaml
  - repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    ref: values
