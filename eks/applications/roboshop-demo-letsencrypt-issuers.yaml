# ClusterIssuers for this cluster's own cert-manager, the EKS add-on; mk4 has a separate one (argocd/cert-manager.yaml).
# The domain is not served from EKS yet, so they solve DNS-01 through Cloudflare. Token: minikube/cert-manager/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-letsencrypt-issuers
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks-platform
  destination:
    name: roboshop-demo
    namespace: cert-manager
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
  source:
    repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    path: minikube/cert-manager/issuers
    helm:
      releaseName: letsencrypt-issuers
      valuesObject:
        dns01:
          zone: jithendar.com
          apiTokenSecret: cloudflare-api-token
          apiTokenKey: api-token
