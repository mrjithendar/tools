# Mesh dashboard at /kiali; the route is in eks/roboshop-demo/ingress. Create the signing key Secret first: eks/RUNBOOK.md, Kiali.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-kiali
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks-platform
  destination:
    name: roboshop-demo
    namespace: istio-system
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
  sources:
  - repoURL: https://kiali.org/helm-charts
    chart: kiali-server
    targetRevision: 2.34.0
    helm:
      releaseName: kiali
      valueFiles:
      - $values/eks/platform/kiali.yaml
  - repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    ref: values
