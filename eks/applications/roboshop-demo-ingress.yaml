# Certificate, Gateway and VirtualService on EKS. The namespace comes from infrastructure/eks-ingress.tf.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-ingress
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: platform
  destination:
    name: roboshop-demo
    namespace: istio-ingress
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
  source:
    repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    path: eks/roboshop-demo/ingress
