{{- if .Values.remoteWrite.enabled }}
# Traefik prefers this longer rule over the /prometheus Ingress, so this one path uses the write-only login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-remote-write
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-prometheus-remote-write-auth@kubernetescrd" .Release.Namespace | quote }}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jithendar.com]
  rules:
    - host: jithendar.com
      http:
        paths:
          - path: /prometheus/api/v1/write
            pathType: Exact
            backend:
              service:
                name: prometheus
                port: {number: 9090}
{{- end }}
