apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- alloy-service-account.yaml
- alloy-logs-cluster-role.yaml
- alloy-logs-cluster-role-binding.yaml
- loki-data-pvc.yaml
- alloy-data-pvc.yaml
- loki-deployment.yaml
- loki-service.yaml
- alloy-deployment.yaml
- alloy-service.yaml
configMapGenerator:
- name: loki-config
  namespace: monitoring
  files: [loki.yaml]
- name: alloy-config
  namespace: monitoring
  files: [config.alloy]
