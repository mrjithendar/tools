# Exposes only the push path, so a remote cluster can send logs but nothing can query them from outside.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-push
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-loki-push-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts: [jithendar.com]
  rules:
  - host: jithendar.com
    http:
      paths:
      - path: /loki/api/v1/push
        pathType: Exact
        backend:
          service:
            name: loki
            port:
              number: 3100
