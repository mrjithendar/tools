# Kubeconfig template for ServiceAccount kube-system/github-minikube-terraform
# (minikube-infrastructure/ci/github-terraform-serviceaccount.yaml). workflows/minikube-terraform-apply.yml fills it in:
#   ${MK4_API_SERVER}        repository variable   cluster API URL
#   ${MK4_CA_DATA}           repository variable   base64 CA certificate of the cluster
#   ${MK4_TERRAFORM_TOKEN}   environment secret    (environment mk4) token from Secret github-minikube-terraform-token
# scripts/setup-minikube-terraform-ci.sh sets them (and renders this file locally to test it).
# Never commit a filled-in copy.
apiVersion: v1
kind: Config
clusters:
- name: mk4
  cluster:
    server: ${MK4_API_SERVER}
    certificate-authority-data: ${MK4_CA_DATA}
users:
- name: github-minikube-terraform
  user:
    token: ${MK4_TERRAFORM_TOKEN}
contexts:
- name: mk4
  context:
    cluster: mk4
    user: github-minikube-terraform
current-context: mk4
