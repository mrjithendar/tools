name: Check infrastructure

# Runs on GitHub-hosted runners with no AWS access: this repository is public, so pull request code must
# never reach the self-hosted runner that applies Terraform.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/*-infrastructure.yml'

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: infrastructure

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: terraform format check
        run: terraform fmt -check -recursive

      - name: terraform init & validate
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      # Mock providers only; see infrastructure/tests.
      - name: terraform test
        run: terraform test -no-color
