name: Create infrastructure

on:
  workflow_dispatch:
  push:
    # Apply from master only: a filter here is what keeps Dependabot and other branches from applying
    # unreviewed Terraform. Pull requests are checked by check-infrastructure.yml.
    branches: [master]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/create-infrastructure.yml'

permissions:
  contents: read

# Never cancel an active apply.
concurrency:
  group: terraform-infrastructure-dev
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: terraform format check
        run: |
          terraform -chdir=infrastructure fmt -check

      - name: terraform init & validate
        run: |
          terraform -chdir=infrastructure init -input=false -no-color
          terraform -chdir=infrastructure validate -no-color

      # - name: terraform test
      #   run: terraform -chdir=infrastructure test -no-color

      - name: terraform plan
        run: |
          umask 077
          terraform -chdir=infrastructure plan -input=false -no-color -lock-timeout=5m \
            -out=tf.tfplan --var-file=vars/terraform.tfvars

      - name: terraform apply
        run: terraform -chdir=infrastructure apply -input=false -no-color -lock-timeout=5m tf.tfplan

      # The plan can hold sensitive values; do not leave it on the runner.
      - name: remove saved plan
        if: always()
        run: rm -f infrastructure/tf.tfplan
