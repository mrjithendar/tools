# Dependabot version updates. Pull requests run check-aws-infrastructure.yml (Terraform fmt, validate and
# mock tests). Merging an infrastructure/ change to master applies it through create-aws-infrastructure.yml.
#
# Minor and patch updates are grouped to keep the PR count down; majors arrive one PR each.
# Security updates are not grouped and are not held back by the cooldown.
#
# Not covered, because Dependabot cannot read them; bump these by hand: the host tools in scripts/setup/versions.json,
# terraform_version in the workflows, and the chart versions in deploy/eks/applications/*.yaml.
# The Minikube images and charts are updated by the miniKube repository's own Dependabot.

version: 2

updates:
  # AWS provider: infrastructure/_provider.tf + .terraform.lock.hcl
  - package-ecosystem: terraform
    directory: /infrastructure
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps(terraform)"

  # Actions in .github/workflows (pinned by commit SHA; Dependabot updates the SHA and the comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions:
        patterns: ["*"]
