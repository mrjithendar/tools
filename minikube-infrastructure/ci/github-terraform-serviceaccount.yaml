# Identity of .github/workflows/create-mk-infrastructure.yml on mk4. Applied once by a person with
# scripts/setup-minikube-terraform-ci.sh, never by CI or Terraform.
#
# cluster-admin, because the releases it applies need it: CRDs, ClusterRoles (Prometheus, Alloy, Kiali, cert-manager,
# istiod; Kubernetes only lets an identity grant permissions it holds), webhooks and APIServices. The token therefore controls the
# whole cluster: it lives only in the GitHub environment "mk4" (master only) and never in a pull request job.
# Revoke it at any time: kubectl --context mk4 -n kube-system delete secret github-minikube-terraform-token
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-minikube-terraform
  namespace: kube-system
  labels: {app.kubernetes.io/part-of: minikube-infrastructure}
---
apiVersion: v1
kind: Secret
metadata:
  name: github-minikube-terraform-token
  namespace: kube-system
  labels: {app.kubernetes.io/part-of: minikube-infrastructure}
  annotations:
    kubernetes.io/service-account.name: github-minikube-terraform
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-minikube-terraform
  labels: {app.kubernetes.io/part-of: minikube-infrastructure}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: github-minikube-terraform
  namespace: kube-system
