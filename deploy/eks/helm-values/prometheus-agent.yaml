# Agent mode keeps only a short write-ahead buffer, so the data lives on mk4, which cannot reach these private nodes.
alertmanager:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
server:
  defaultFlagsOverride:
  - --agent
  - --config.file=/etc/config/prometheus.yml
  - --storage.agent.path=/data
  persistentVolume:
    enabled: false
  retention: ""
  global:
    scrape_interval: 30s
    external_labels:
      cluster: roboshop-demo
  remoteWrite:
  - url: https://jithendar.com/prometheus/api/v1/write
    basic_auth:
      username: eks
      password_file: /etc/secrets/remote-write/password
  extraSecretMounts:
  - name: remote-write-auth
    mountPath: /etc/secrets/remote-write
    secretName: prometheus-remote-write-auth
    readOnly: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
# null drops the chart's default jobs, which would push every pod and node metric to mk4.
scrapeConfigs: null
serverFiles:
  prometheus.yml:
    rule_files: []
    scrape_configs:
    - job_name: eks-node-exporter
      kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names:
          - prometheus-node-exporter
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_service_name
        regex: prometheus-node-exporter
        action: keep
      - source_labels:
        - __meta_kubernetes_pod_node_name
        target_label: node
    # Bounded to what the dashboards and failure checks read: unfiltered it is 5000 series, as many as everything else here.
    - job_name: eks-kube-state-metrics
      kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names:
          - kube-state-metrics
      relabel_configs:
      - source_labels:
        - __meta_kubernetes_service_name
        regex: kube-state-metrics
        action: keep
      metric_relabel_configs:
      - source_labels:
        - __name__
        regex: kube_(pod_status_phase|pod_status_ready|pod_container_status_(restarts_total|waiting_reason|last_terminated_reason)|pod_container_resource_(requests|limits)|deployment_(spec_replicas|status_replicas_available)|statefulset_(replicas|status_replicas_ready)|daemonset_status_(desired_number_scheduled|number_ready)|horizontalpodautoscaler_(spec_max_replicas|status_current_replicas|status_desired_replicas)|node_status_(condition|allocatable)|persistentvolumeclaim_status_phase|job_status_failed)
        action: keep
