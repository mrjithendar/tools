# The gateway pods and the Service that becomes the NLB. Deleting that Service deletes the NLB.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-istio-ingressgateway
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks-platform
  destination:
    name: roboshop-demo
    namespace: istio-ingress
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  sources:
  - repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.30.7
    helm:
      releaseName: istio-ingressgateway
      valueFiles:
      - $values/deploy/eks/helm-values/istio-ingressgateway.yaml
  - repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    ref: values
