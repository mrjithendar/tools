# Istio control plane. Sync after roboshop-demo-istio-base.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-istiod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks-platform
  destination:
    name: roboshop-demo
    namespace: istio-system
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
  # istiod fills in the CA and turns failurePolicy to Fail once it is serving.
  ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    jqPathExpressions:
    - .webhooks[]?.clientConfig.caBundle
    - .webhooks[]?.failurePolicy
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
    jqPathExpressions:
    - .webhooks[]?.clientConfig.caBundle
  sources:
  - repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.7
    helm:
      releaseName: istiod
      valueFiles:
      - $values/deploy/eks/helm-values/istiod.yaml
  - repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    ref: values
