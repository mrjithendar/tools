# Pushes pod logs to the Loki on mk4. Create the Secret first: deploy/eks/DEPLOY.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-alloy
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks-platform
  destination:
    name: roboshop-demo
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  source:
    repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    path: deploy/eks/manifests/alloy
    directory:
      recurse: false
      include: '*.yaml'
