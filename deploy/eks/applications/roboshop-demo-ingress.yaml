# Certificate, Gateway and VirtualServices on EKS, as plain YAML. The namespace comes from roboshop-demo-istio-ingressgateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-ingress
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks-platform
  destination:
    name: roboshop-demo
    namespace: istio-ingress
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
  source:
    repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    path: deploy/eks/manifests/ingress
    directory:
      recurse: false
      include: '*.yaml'
