# ClusterIssuers for this cluster's own cert-manager, the EKS add-on. Plain YAML, with no dependency on Minikube's chart or Helm.
# The domain is not served from EKS yet, so they solve DNS-01 through Cloudflare. Token: deploy/eks/DEPLOY.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-letsencrypt-issuers
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks-platform
  destination:
    name: roboshop-demo
    namespace: cert-manager
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
  source:
    repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    path: deploy/eks/manifests/cert-manager
    directory:
      recurse: false
      include: '*.yaml'
