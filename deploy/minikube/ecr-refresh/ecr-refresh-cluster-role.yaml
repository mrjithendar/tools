# Every namespace except Kubernetes' own gets an ecr-pull Secret (refresh.py, EXCLUDED_NAMESPACES).
# `create` cannot be limited by name in RBAC; refresh.py only ever creates ecr-pull.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ecr-refresh
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - list
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - ecr-pull
  verbs:
  - get
  - patch
- apiGroups:
  - ''
  resources:
  - serviceaccounts
  resourceNames:
  - default
  verbs:
  - get
  - patch
