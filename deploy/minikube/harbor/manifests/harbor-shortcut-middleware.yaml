# jithendar.com/harbor[/…] → the portal's own /harbor/… routes on the registry hostname.
# Harbor cannot be served under a path prefix: README.md "Why a hostname, not jithendar.com/harbor".
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: harbor-shortcut
  namespace: harbor
spec:
  redirectRegex:
    regex: ^https?://jithendar\.com/harbor(/.*)?$
    replacement: https://registry.jithendar.com/harbor${1}
    permanent: false
