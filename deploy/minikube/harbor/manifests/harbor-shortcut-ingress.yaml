# Same pattern as vault-shortcut and jfrog-shortcut: no secretName, so Traefik serves jithendar.com's default certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor-shortcut
  namespace: harbor
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: harbor-harbor-shortcut@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - jithendar.com
  rules:
  - host: jithendar.com
    http:
      paths:
      - path: /harbor
        pathType: Prefix
        backend:
          service:
            name: harbor-portal
            port:
              number: 80
