# Signs only the token-service key pair below; nothing outside Harbor trusts it.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: harbor-token-selfsigned
  namespace: harbor
  annotations:
    # Before the wave -1 Certificate that uses it: Argo CD waits for that Certificate to be Ready before wave 0.
    argocd.argoproj.io/sync-wave: '-2'
spec:
  selfSigned: {}
