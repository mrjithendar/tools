# Harbor's Redis (redis.type external in ../values.yaml), with a password: Harbor keeps portal sessions here, and
# mk4 does not prove NetworkPolicy enforcement. The password goes into a config file, not the command line.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harbor-redis
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor-redis
    app.kubernetes.io/part-of: harbor
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  serviceName: harbor-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-redis
        app.kubernetes.io/part-of: harbor
    spec:
      nodeSelector:
        kubernetes.io/hostname: mk4-m05
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
      # minikube's hostpath volumes are root-owned and ignore fsGroup, so Valkey (uid 999) could not write
      # /data ("Can't open or create append-only dir: Permission denied"). Hand the volume over once, as root
      # with only CAP_CHOWN.
      initContainers:
      - name: chown-data
        image: valkey/valkey:8.1.11-alpine
        command: [chown, '999:999', /data]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
            add: [CHOWN]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 32Mi}
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: valkey
        image: valkey/valkey:8.1.11-alpine
        command: [sh, -c]
        args:
        - |
          umask 077
          printf 'requirepass "%s"\n' "$REDIS_PASSWORD" > /run/valkey/valkey.conf
          unset REDIS_PASSWORD
          exec valkey-server /run/valkey/valkey.conf --dir /data --appendonly yes \
            --maxmemory 200mb --maxmemory-policy noeviction
        ports:
        - name: redis
          containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef: {name: harbor-credentials, key: REDIS_PASSWORD}
        # valkey-cli reads the password from here, so probes do not put it on a command line.
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef: {name: harbor-credentials, key: REDIS_PASSWORD}
        readinessProbe:
          exec:
            command: [sh, -c, valkey-cli ping | grep -q PONG]
          periodSeconds: 10
        livenessProbe:
          exec:
            command: [sh, -c, valkey-cli ping | grep -q PONG]
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 6
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 250m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: data
          mountPath: /data
        - name: run
          mountPath: /run/valkey
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: harbor-redis-data
      - name: run
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
