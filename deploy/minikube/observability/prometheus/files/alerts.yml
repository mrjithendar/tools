groups:
  - name: roboshop
    rules:
      - alert: RoboShopServiceDown
        expr: up{job="roboshop"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'RoboShop service {{ $labels.instance }} is not responding'
      - alert: RoboShopHighErrorRatio
        expr: sum by (service) (rate(roboshop_http_requests_total{status=~"5.."}[5m])) / sum by (service) (rate(roboshop_http_requests_total[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'More than 10% of {{ $labels.service }} requests fail'
      - alert: RoboShopHighLatency
        expr: histogram_quantile(0.95, sum by (service, route, le) (rate(http_server_request_duration_seconds_bucket{job="roboshop", route!=""}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service }} {{ $labels.route }} p95 latency is above 2s'
  - name: observability
    rules:
      - alert: ObservabilityTargetDown
        expr: up{job=~"loki|alloy"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} is not responding; logs may not be collected'
  - name: jithendar-com
    rules:
      - alert: JithendarComDown
        expr: up{job="jithendar-com"} == 0 or absent(up{job="jithendar-com"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'jithendar.com pod {{ $labels.instance }} is not answering metrics scrapes'
      - alert: JithendarComHighErrorRatio
        expr: sum(rate(http_server_requests_total{job="jithendar-com", status="5xx"}[5m])) / sum(rate(http_server_requests_total{job="jithendar-com"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'More than 5% of jithendar.com requests fail with 5xx'
      - alert: JithendarComSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="jithendar-com", route!="other"}[10m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'jithendar.com p95 page time is above 2 s'
