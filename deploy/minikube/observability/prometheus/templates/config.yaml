apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    # Rules are visible under Alerts; no Alertmanager is configured for delivery.
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        metrics_path: /prometheus/metrics
        static_configs:
          - targets: ["localhost:9090"]
      {{- if .Values.kubernetesMetrics.enabled }}
      {{- range $job, $path := dict "kubernetes-kubelet" "metrics" "kubernetes-cadvisor" "metrics/cadvisor" }}
      - job_name: {{ $job }}
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/{{ $path }}
      {{- end }}
      {{- end }}
      {{- if and .Values.kubernetesMetrics.enabled .Values.istioMetrics.enabled }}
      # Istio control plane and sidecars (Kiali, https://jithendar.com/kiali/). Same jobs as Istio's samples/addons
      # prometheus.yaml. Sidecars exist only in namespaces labelled istio-injection=enabled.
      - job_name: istiod
        static_configs:
          - targets: ["istiod.istio-system.svc.cluster.local:15014"]
      - job_name: envoy-stats
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: '.*-envoy-prom'
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      {{- end }}
      {{- with .Values.extraScrapeConfigs }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  alerts.yml: |
    {{- .Files.Get "files/alerts.yml" | nindent 4 }}
