apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    # terraform destroy and helm uninstall leave the volume and its data.
    helm.sh/resource-policy: keep
  name: loki-data
  namespace: monitoring
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
