# kubectl --context mk4 apply -k deploy/minikube/observability/jaeger (no Argo CD Application, see ../README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- jaeger-deployment-minikube.yaml
- jaeger-service-minikube.yaml
configMapGenerator:
- name: jaeger-config
  namespace: observability
  files:
  - config.yaml=jaeger.yaml
