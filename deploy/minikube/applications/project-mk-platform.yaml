apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mk-platform
  namespace: argocd
spec:
  description: mk4 workloads; Argo CD, cert-manager, metrics-server and Kong are Terraform Helm releases (minikube-infrastructure), Traefik is installed by bootstrap
  sourceRepos:
  - https://github.com/mrjithendar/roboshop-ai.git
  - https://github.com/mrjithendar/tools.git
  - https://github.com/mrjithendar/moks.git
  - https://github.com/mrjithendar/jithendar.com.git
  - https://grafana-community.github.io/helm-charts
  - https://charts.jfrog.io
  destinations:
  - namespace: roboshop-ai
    server: https://kubernetes.default.svc
  - namespace: monitoring
    server: https://kubernetes.default.svc
  - namespace: observability
    server: https://kubernetes.default.svc
  - namespace: jithendar
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  - group: apiregistration.k8s.io
    kind: APIService
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
  - group: cert-manager.io
    kind: ClusterIssuer
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceBlacklist:
  - group: ''
    kind: Secret
