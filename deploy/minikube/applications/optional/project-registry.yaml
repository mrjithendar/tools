apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mk-registry
  namespace: argocd
spec:
  description: Harbor on mk4. Its own project because the chart renders Secrets, which mk-platform forbids;
    scripts/argocd/validate.py checks that they carry no credentials.
  sourceRepos:
  - https://github.com/mrjithendar/tools.git
  - https://helm.goharbor.io
  destinations:
  - namespace: harbor
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: PersistentVolumeClaim
  - group: ''
    kind: Secret
  - group: ''
    kind: Service
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: batch
    kind: CronJob
  - group: networking.k8s.io
    kind: Ingress
  - group: traefik.io
    kind: Middleware
  - group: cert-manager.io
    kind: Certificate
  - group: cert-manager.io
    kind: Issuer
