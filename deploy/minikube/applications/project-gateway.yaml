apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mk-gateway
  namespace: argocd
spec:
  description: mk4 edge gateway (Kong Gateway OSS, database mode) and its PostgreSQL. Git owns the infrastructure only; Kong entities live in Kong's database.
  sourceRepos:
  - https://github.com/mrjithendar/tools.git
  destinations:
  - namespace: kong
    server: https://kubernetes.default.svc
  # The namespace comes from deploy/minikube/namespaces/kong.yaml (deploy.py), like every app here.
  clusterResourceWhitelist:
  - group: storage.k8s.io
    kind: StorageClass
  namespaceResourceWhitelist:
  - {group: '', kind: ConfigMap}
  - {group: '', kind: Service}
  - {group: '', kind: PersistentVolumeClaim}
  - {group: apps, kind: Deployment}
  - {group: apps, kind: StatefulSet}
  - {group: batch, kind: Job}
  - {group: networking.k8s.io, kind: NetworkPolicy}
  - {group: cert-manager.io, kind: Certificate}
  # Secrets stay out of Git (create-secrets.sh). Kong's CRDs (KongPlugin etc.) are not listed: with no
  # Kong Ingress Controller they would do nothing.
  namespaceResourceBlacklist:
  - group: ''
    kind: Secret
