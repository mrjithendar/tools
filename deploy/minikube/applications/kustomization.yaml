apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Argo CD catalog for mk4: the AppProject "mk-platform" and nothing else by default. The cluster add-ons (metrics-server,
# cert-manager, Istio, Kiali, Prometheus, Grafana, Loki, OpenTelemetry Collector, Jaeger) are Terraform Helm releases in
# minikube-infrastructure/, not Applications. scripts/argocd/*.py read this catalog. RoboShop: roboshop-ai/argocd-eks.
resources:
- project-mk-platform.yaml
