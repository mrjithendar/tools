apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Argo CD catalog for the shared platform on mk4: the AppProjects "mk-platform"
# and "observability", the observability stack (sources in this repo, deploy/minikube/observability/…) and metrics-server.
# scripts/argocd/*.py read this catalog. RoboShop runs on EKS: see roboshop-ai/argocd-eks.
resources:
- project-mk-platform.yaml
- project-observability.yaml
- metrics-server.yaml
- grafana.yaml
- prometheus.yaml
- loki.yaml
- otel-collector.yaml
- jaeger.yaml
