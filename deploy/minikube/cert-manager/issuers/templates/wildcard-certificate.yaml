{{- with .Values.certificate }}
{{- if .enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name | quote }}
  namespace: {{ .namespace | quote }}
spec:
  secretName: {{ .secretName | quote }}
  dnsNames: {{ toYaml .dnsNames | nindent 4 }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ .issuer | quote }}
{{- end }}
{{- end }}
