apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Database-backed Kong Gateway OSS 3.9.4 on mk4, owned by the Argo CD Application "kong"
# (../applications/kong.yaml). Git owns only the infrastructure below. Kong's own entities (Services, Routes,
# Plugins, Consumers, Upstreams) live in Kong's PostgreSQL database and are managed in Kong Manager; see
# docs/kong/02-architecture.md. Secrets are never in Git: create-secrets.sh creates them.
#
# Sync waves: 0 storage and PostgreSQL, 1 the bootstrap Job, 2 Kong and the certificate sidecar.
# upgrade/ is not listed here on purpose: those Jobs are applied by hand during a version upgrade.
resources:
- storageclass-retain.yaml
- kong-postgres-data-pvc.yaml
- kong-postgres-init-configmap.yaml
- kong-postgres-service.yaml
- kong-postgres-statefulset.yaml
- kong-config.yaml
- migrations-bootstrap-job.yaml
- cert-sync.yaml
- kong-deployment.yaml
- kong-proxy-service.yaml
- kong-proxy-test-service.yaml
- kong-admin-service.yaml
- kong-manager-service.yaml
- kong-status-service.yaml
- default-deny-networkpolicy.yaml
- kong-networkpolicy.yaml
- kong-postgres-networkpolicy.yaml
- kong-jobs-networkpolicy.yaml
- jithendar-com-certificate.yaml
- db-jithendar-com-certificate.yaml
