# Kong's certificates, issued by cert-manager into this namespace and uploaded to Kong by cert-sync
# (cert-sync.yaml). Same names and hosts as the Certificates Traefik uses in namespace jithendar, which stay in
# place for rollback.
#
# Issuer: ClusterIssuer letsencrypt-prod, owned by the jithendar.com repository. It must solve with DNS-01
# (Cloudflare) before Traefik is removed: its HTTP-01 solver creates Traefik Ingresses, which nothing serves
# once Traefik is gone, and Kong without a controller cannot read them (docs/kong/02-architecture.md, TLS).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jithendar-com
  namespace: kong
  labels:
    app.kubernetes.io/part-of: kong-gateway
spec:
  secretName: jithendar-com-tls
  dnsNames:
  - jithendar.com
  - www.jithendar.com
  privateKey:
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
