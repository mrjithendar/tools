apiVersion: v1
kind: Service
metadata:
  name: kong-postgres
  namespace: kong
  labels:
    app.kubernetes.io/name: kong-postgres
    app.kubernetes.io/part-of: kong-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kong-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
