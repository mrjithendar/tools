# `kong migrations bootstrap`, once. How repeat and concurrent runs are prevented:
#
#   1. Not an Argo CD hook. Hooks (PreSync/Sync) are created again on every sync; this is an ordinary resource,
#      so Argo CD creates it only when it is missing and otherwise just compares it. A completed Job is not
#      re-run by a sync.
#   2. No ttlSecondsAfterFinished: if Kubernetes deleted the finished Job, Argo CD would see it missing and
#      create it again on the next sync.
#   3. The name carries the Kong version. A Job's pod template is immutable, so an upgrade cannot quietly reuse
#      this Job; upgrades use upgrade/migrations-up-job.yaml and upgrade/migrations-finish-job.yaml, by hand.
#   4. parallelism 1 / completions 1, and Kong itself: bootstrap takes the database cluster mutex
#      (kong/cmd/utils/migrations.lua) and prints "Database already bootstrapped" without changing anything when
#      the schema exists. A second run is a no-op, never a reset (that would need --force or `migrations reset`).
#
# Never add --force here: it resets the database.
apiVersion: batch/v1
kind: Job
metadata:
  name: kong-migrations-bootstrap-3-9-4
  namespace: kong
  labels:
    app.kubernetes.io/name: kong-migrations
    app.kubernetes.io/part-of: kong-gateway
    app.kubernetes.io/version: "3.9.4"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Pruning this Job would let the next sync create it again.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong-migrations
        app.kubernetes.io/part-of: kong-gateway
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-postgres
        image: postgres:17.11-alpine
        imagePullPolicy: IfNotPresent
        command: [sh, -c, "until pg_isready -h kong-postgres.kong.svc.cluster.local -p 5432 -U kong -d kong; do sleep 3; done"]
        securityContext:
          runAsUser: 70
          runAsGroup: 70
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
      containers:
      - name: bootstrap
        image: kong:3.9.4
        imagePullPolicy: IfNotPresent
        command: [kong, migrations, bootstrap, --lock-timeout, "120", --vv]
        envFrom:
        - configMapRef: {name: kong-config}
        env:
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef: {name: kong-postgres, key: kong-password}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        volumeMounts:
        - {name: prefix, mountPath: /kong_prefix}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - {name: prefix, emptyDir: {}}
      - {name: tmp, emptyDir: {}}
